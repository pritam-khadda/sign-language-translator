<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Language Translator</title>

    <style>
        :root {
            --bg: #111;
            --card: #222;
            --text: white;
            --accent: #00ff99;
            --warning: #ffcc00;
            --danger: #ff4444;
        }

        [data-theme="light"] {
            --bg: #f5f5f5;
            --card: white;
            --text: #111;
            --accent: #00aa66;
            --warning: #d9a900;
            --danger: #dd3333;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            transition: 0.3s;
        }

        h1 {
            margin-top: 10px;
        }

        .top-bar {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin: 20px 0;
        }

        button {
            padding: 12px 20px;
            border: none;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
        }

        button:hover {
            opacity: 0.85;
        }

        .theme-btn {
            background: var(--accent);
            color: black;
        }

        .container {
            display: flex;
            justify-content: center;
            margin-top: 20px;
        }

        .video-box {
            width: 720px;
            height: 480px;
            border: 3px solid var(--accent);
            border-radius: 10px;
            overflow: hidden;
            background: black;
        }

        #videoStream {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .info {
            margin-top: 20px;
        }

        .box {
            background: var(--card);
            padding: 18px;
            margin: 10px auto;
            width: 350px;
            max-width: 90%;
            border-radius: 10px;
            font-size: 18px;
        }

        .prediction {
            font-size: 28px;
            font-weight: bold;
            color: var(--accent);
        }

        .word {
            font-size: 26px;
            font-weight: bold;
        }

        .confidence-container {
            width: 350px;
            max-width: 90%;
            margin: 15px auto;
        }

        .confidence-bar-bg {
            width: 100%;
            height: 15px;
            background: #444;
            border-radius: 10px;
            overflow: hidden;
        }

        #conf-bar {
            height: 100%;
            width: 0%;
            background: var(--accent);
            transition: width 0.3s;
        }

        .status {
            margin: 15px;
            font-weight: bold;
        }

        .btn-container {
            margin-top: 25px;
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .clear-btn {
            background: var(--accent);
            color: black;
        }

        .voice-btn {
            background: var(--warning);
            color: black;
        }

        .copy-btn {
            background: #4da6ff;
            color: white;
        }

        .download-btn {
            background: #9b59b6;
            color: white;
        }

        .fullscreen-btn {
            background: #555;
            color: white;
        }

        .history-section {
            margin: 30px auto;
            max-width: 500px;
        }

        .history-list {
            background: var(--card);
            border-radius: 10px;
            padding: 10px;
        }

        .history-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            margin: 5px 0;
            background: rgba(128,128,128,0.15);
            border-radius: 8px;
            text-align: left;
        }

        .history-item button {
            background: var(--danger);
            color: white;
            padding: 5px 10px;
        }

        .toast-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 9999;
        }

        .toast {
            background: #333;
            color: white;
            padding: 15px 20px;
            margin-top: 10px;
            border-radius: 8px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.3);
        }

        @keyframes slideIn {
            from {
                transform: translateY(-10px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @media (max-width: 800px) {
            .video-box {
                width: 95vw;
                height: 60vw;
            }
        }
    </style>
</head>

<body>

    <h1>🤟 Sign Language Translator</h1>
    <p>Real-Time Hand Gesture Recognition</p>

    <!-- TOP BAR -->
    <div class="top-bar">

        <button class="theme-btn" onclick="toggleTheme()">
            🌙 Theme
        </button>

        <span id="conn-status" class="status">
            🟢 AI Online
        </span>

    </div>


    <!-- VIDEO -->
    <div class="container">

        <div class="video-box">

            <img
                id="videoStream"
                src="{{ url_for('video_feed') }}"
                alt="Camera Stream"
            >

        </div>

    </div>


    <!-- PREDICTION / WORD -->
    <div class="info">

        <div class="box">

            🔮 Prediction:

            <div
                id="live-prediction"
                class="prediction"
            >
                Loading...
            </div>

        </div>


        <div class="box">

            📝 Current Word:

            <div
                id="current-word"
                class="word"
            >
                ---
            </div>

        </div>


        <!-- CONFIDENCE -->

        <div class="confidence-container">

            <p>
                Confidence:
                <strong id="conf-val">0%</strong>
            </p>

            <div class="confidence-bar-bg">

                <div id="conf-bar"></div>

            </div>

        </div>

    </div>


    <!-- BUTTONS -->

    <div class="btn-container">

        <button
            class="clear-btn"
            onclick="clearCurrentWord()"
        >
            🗑️ Clear
        </button>


        <button
            class="voice-btn"
            onclick="toggleVoice()"
        >
            🔊 Voice ON / OFF
        </button>


        <button
            class="copy-btn"
            onclick="copyTranslation()"
        >
            📋 Copy
        </button>


        <button
            class="download-btn"
            onclick="downloadHistory()"
        >
            📥 Download History
        </button>


        <button
            class="fullscreen-btn"
            onclick="document.getElementById('videoStream').requestFullscreen()"
        >
            ⛶ Fullscreen
        </button>

    </div>


    <!-- VOICE STATUS -->

    <div class="status">

        <span id="voice-status">
            Status: Unknown
        </span>

    </div>


    <!-- HISTORY -->

    <div class="history-section">

        <h2>📜 Translation History</h2>

        <div
            id="history-list"
            class="history-list"
        >
            No history yet.
        </div>

    </div>


    <!-- TOAST -->

    <div
        id="toast-container"
        class="toast-container"
    ></div>


    <!-- JAVASCRIPT -->

    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
